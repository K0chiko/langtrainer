<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4c9bff"/>
      <stop offset="1" stop-color="#0a56c2"/>
    </linearGradient>
    <linearGradient id="ru" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#ffb02e"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#00152e" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <!-- English bubble -->
  <g filter="url(#sh)">
    <path d="M250 270 h310 a70 70 0 0 1 70 70 v170 a70 70 0 0 1 -70 70 h-190 l-90 80 v-80 h-30 a70 70 0 0 1 -70 -70 v-170 a70 70 0 0 1 70 -70 z" fill="#fff"/>
  </g>
  <text x="375" y="460" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700" font-size="190" text-anchor="middle" fill="#0a56c2">A</text>
  <!-- Russian bubble -->
  <g filter="url(#sh)">
    <path d="M474 430 h310 a70 70 0 0 1 70 70 v170 a70 70 0 0 1 -70 70 h-30 v80 l-90 -80 h-190 a70 70 0 0 1 -70 -70 v-170 a70 70 0 0 1 70 -70 z" fill="url(#ru)"/>
  </g>
  <text x="629" y="630" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700" font-size="190" text-anchor="middle" fill="#7a3d00">Я</text>
</svg>
