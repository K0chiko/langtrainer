[project]
name = "langtrainer"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "K0chiko", email = "108746846+K0chiko@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "av>=14,<16",
    "fastapi>=0.143.2",
    "faster-whisper>=1.2.1",
    "jinja2>=3.1.6",
    "numpy>=1.26",
    "pydantic-settings>=2.16.0",
    "pyaudiowpatch>=0.2.12; sys_platform == 'win32'",
    "python-multipart>=0.0.32",
    "sqlmodel>=0.0.48",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
langtrainer = "langtrainer:main"

[project.optional-dependencies]
mlx = [
    "mlx-whisper>=0.4.3",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
